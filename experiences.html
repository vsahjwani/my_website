<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" type="image/png" href="assets/fav1.png" />
<title>Experiences: Vani's Archive</title>
<style>
  @font-face { font-family:"Over the Rainbow"; src:url("assets/fonts/The_Girl_Next_Door/TheGirlNextDoor-Regular.ttf") format("truetype"); font-display:swap; }
  @font-face { font-family:"CoalhandLuke"; src:url("assets/fonts/Cedarville_Cursive/CedarvilleCursive-Regular.ttf") format("truetype"); font-display:swap; }
  /* Experiences page — mirrors the nav page: corkboard backdrop + a board
     that scales/reflows to any screen, elements with the same white-outline
     hover and the same hover/click sounds. */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  html { background: #e9e6df; }
  body {
    overflow: hidden;                     /* single-screen board, no scroll */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  .corkboard {
    position: fixed; inset: 0;
    background: url("assets/5.png") center center / cover no-repeat;
    z-index: 0;
  }

  /* Same board system as the nav page. left/top mark each element's CENTER. */
  .navboard {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    /* LANDSCAPE (wider-than-tall) board */
    width:  min(100vw, calc(100svh * 16 / 9));
    height: min(100svh, calc(100vw * 9 / 16));
  }

  .navel {
    position: absolute;
    transform: translate(-50%, -50%);
    display: block;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  /* .art is either an <img> (post-its) or a <span> that crops an element out
     of its full-canvas PNG via background-size/position (the envelopes). */
  .navel .art {
    display: block;
    width: 100%;
    height: auto;
    background-repeat: no-repeat;
    pointer-events: none;
    -webkit-user-drag: none;
    user-select: none;
    transition: transform .12s ease, filter .1s ease;
  }
  .navel:hover { z-index: 10; }
  .navel:focus-visible { outline: none; }
  /* crisp (0-blur) white outline hugs the artwork -> instant, no lag */
  .navel:hover .art, .navel:focus-visible .art {
    transform: scale(1.05);
    filter:
      drop-shadow( 2.5px  0     0 #fff) drop-shadow(-2.5px  0     0 #fff)
      drop-shadow( 0      2.5px 0 #fff) drop-shadow( 0     -2.5px 0 #fff)
      drop-shadow( 1.8px  1.8px 0 #fff) drop-shadow(-1.8px  1.8px 0 #fff)
      drop-shadow( 1.8px -1.8px 0 #fff) drop-shadow(-1.8px -1.8px 0 #fff)
      drop-shadow( 0 6px 9px rgba(0,0,0,.28));
  }

  /* ---------- LANDSCAPE positions ---------- */
  #e-professional { left: 30%; top: 34%; width: 56%; }
  #e-campus       { left: 70%; top: 66%; width: 56%; }
  /* shared elements -- same positions/links as the nav page */
  #e-linkedin     { left: 74%; top: 8%;  width: 10.1%; }
  #e-github       { left: 76%; top: 22%; width: 10.1%; }
  #e-email        { left: 85%; top: 9%;  width: 9.9%;  }
  #e-nav          { left: 94%; top: 13%; width: 10.1%; }

  /* ---------- SQUARE / PORTRAIT: taller board, vertical spread ---------- */
  @media (max-aspect-ratio: 1/1) {
    .navboard {
      width:  min(100vw, calc(100svh * 3 / 4));
      height: min(100svh, calc(100vw * 4 / 3));
    }
    #e-professional { left: 50%; top: 38%; width: 80%; }
    #e-campus       { left: 50%; top: 77%; width: 82%; }
    #e-linkedin     { left: 20%; top: 6%;  width: 15%;   }
    #e-github       { left: 40%; top: 6%;  width: 15%;   }
    #e-email        { left: 60%; top: 6%;  width: 14.7%; }
    #e-nav          { left: 80%; top: 6%;  width: 15%;   }
  }

  /* ---- contact popup (identical to the nav page) ---- */
  .modal {
    position: fixed; inset: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease;
  }
  .modal.open { opacity: 1; pointer-events: auto; }
  .modal-backdrop {
    position: absolute; inset: 0;
    background: transparent;              /* corkboard shows through, undimmed */
    cursor: pointer;
  }
  .contact-note {
    position: relative;
    width: min(90vw, 420px);
    transform: rotate(2.8deg);
  }
  .modal.open .contact-note { animation: pop .35s ease; }
  .contact-note img {
    width: 100%; display: block;
    pointer-events: none; user-select: none; -webkit-user-drag: none;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(12px) scale(.96) rotate(-2.8deg); }
    to   { opacity: 1; transform: translateY(0)    scale(1)   rotate(-2.8deg); }
  }
  .contact-note .note {
    position: absolute; inset: 0;
    padding: 15% 11%;
    display: flex; flex-direction: column; justify-content: flex-start;
  }
  .contact-note .line {
    color: #575757;
    text-shadow: .25px .25px 0 rgba(0, 0, 0, .15);
    letter-spacing: .02em;
    line-height: 1.05;
  }
  .contact-note .title {
    font-family: "CoalhandLuke", cursive;
    font-size: clamp(1.8rem, 6.5vw, 3.2rem);
    margin-bottom: clamp(14px, 4vw, 32px);
    transform: rotate(-1deg);
  }
  .contact-note .row {
    font-family: "Over the Rainbow", cursive;
    font-size: clamp(1.1rem, 3.8vw, 2.2rem);
    margin-bottom: clamp(10px, 3vw, 24px);
    transform: rotate(.8deg);
  }
  .contact-note .note a {
    color: inherit; text-decoration: none;
    width: max-content; transition: .15s ease;
  }
  .contact-note .note a:hover  { opacity: .65; transform: translateX(2px); }
  .contact-note .note a:active { transform: translateX(3px); }
</style>
</head>
<body>

  <div class="corkboard"></div>

  <div class="navboard">
    <!-- main content: the two envelopes, side by side.
         Each is cropped out of its full-canvas PNG via background-size/position.
         TODO: professional.html / campus.html are placeholders to be built. -->
    <a class="navel" id="e-campus" href="campus.html" aria-label="Campus">
      <span class="art" style="aspect-ratio:679/441; background-image:url('assets/41.png'); background-size:201.2% 174.1%; background-position:95.34% 91.44%;"></span>
    </a>
    <a class="navel" id="e-professional" href="professional.html" aria-label="Professional">
      <span class="art" style="aspect-ratio:646/376; background-image:url('assets/40.png'); background-size:211.5% 204.3%; background-position:10.28% 8.93%;"></span>
    </a>

    <!-- shared post-its: same PNGs, positions, links, hover + sounds as nav -->
    <a class="navel" id="e-linkedin" href="https://www.linkedin.com/in/vani-sahjwani/" aria-label="LinkedIn"><img class="art" src="assets/37.png" alt="LinkedIn" /></a>
    <a class="navel" id="e-github" href="https://github.com/vsahjwani" aria-label="GitHub"><img class="art" src="assets/34.png" alt="GitHub" /></a>
    <a class="navel" id="e-email" data-modal="contact" href="contact.html" aria-label="Email"><img class="art" src="assets/36.png" alt="Email" /></a>
    <a class="navel" id="e-nav" href="index.html#nav" aria-label="Back to nav page"><img class="art" src="assets/38.png" alt="Nav" /></a>

  <!-- CONTACT POPUP -->
  <div class="modal" id="contactModal">
    <div class="modal-backdrop" id="contactBackdrop"></div>

        <a class="line row" href="mailto:vanisahjwani@gmail.com">vanisahjwani@gmail.com</a>

        <a class="line row" href="https://www.linkedin.com/in/vani-sahjwani/">linkedin.com</a>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  // --- sounds (same as nav page) ---
  function snd(src, vol) { var a = new Audio(src); a.preload = "auto"; a.volume = vol; return a; }
  var sndHover = snd("hover.mp3", 0.55);
  var sndClick = snd("click.mp3", 0.8);
  function play(a) {
    try { a.currentTime = 0; var pr = a.play(); if (pr && pr.catch) pr.catch(function () {}); }
    catch (e) {}
  }
  var audioPrimed = false;
  function primeAudio() {
    if (audioPrimed) return;
    audioPrimed = true;
    [[sndHover, 0.55], [sndClick, 0.8]].forEach(function (pair) {
      var a = pair[0]; a.volume = 0;
      try {
        var pr = a.play();
        if (pr && pr.then) pr.then(function () { a.pause(); a.currentTime = 0; a.volume = pair[1]; })
                             .catch(function () { a.volume = pair[1]; });
        else a.volume = pair[1];
      } catch (e) { a.volume = pair[1]; }
    });
  }
  ["pointerdown", "touchstart", "keydown"].forEach(function (ev) {
    window.addEventListener(ev, primeAudio, { once: true, passive: true });
  });

  // hover.mp3 on entering a new element, click.mp3 on press
  document.querySelectorAll(".navel").forEach(function (a) {
    a.addEventListener("mouseenter", function () { play(sndHover); });
    a.addEventListener("pointerdown", function () { play(sndClick); });
  });

  // --- contact popup (identical behavior to the nav page) ---
  var contactModal    = document.getElementById("contactModal");
  var contactBackdrop = document.getElementById("contactBackdrop");
  var emailBtn        = document.querySelector('[data-modal="contact"]');
  var lastFocused     = null;
  function openModal() { lastFocused = document.activeElement; contactModal.classList.add("open"); }
  function closeModal() { contactModal.classList.remove("open"); if (lastFocused && lastFocused.focus) lastFocused.focus(); }
  if (emailBtn) emailBtn.addEventListener("click", function (e) { e.preventDefault(); openModal(); });
  contactBackdrop.addEventListener("click", closeModal);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && contactModal.classList.contains("open")) closeModal();
  });
})();
</script>
</body>
</html>
