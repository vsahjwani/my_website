<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" type="image/png" href="assets/fav1.png" />
<title>Vani's Archive</title>
<style>
  @font-face { font-family:"Over the Rainbow"; src:url("assets/fonts/The_Girl_Next_Door/TheGirlNextDoor-Regular.ttf") format("truetype"); font-display:swap; }
  @font-face { font-family:"CoalhandLuke"; src:url("assets/fonts/Cedarville_Cursive/CedarvilleCursive-Regular.ttf") format("truetype"); font-display:swap; }
  /* ============================================================
     Vani's Archive — portfolio landing
     - Home page (paper + polaroid + title)
     - Scroll down: stop-motion "tear away" transition (frames 6–27)
       revealing the corkboard nav page underneath.
     - Nav page: clickable pinned elements -> each section.
     Everything sits on a fixed 1366x768 "board" that scales to any
     screen/ratio, centered, with the corkboard filling the backdrop.
     ============================================================ */

  :root{
    --board-w: 1366;
    --board-h: 768;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { scroll-behavior: auto; background:#e9e6df; }
  body {
    overflow-x: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  /* The scroll driver: its extra height gives us scroll travel to
     scrub the transition. The stage stays pinned inside it. */
  .scroll-wrap { position: relative; height: 320vh; }

  .stage {
    position: sticky;
    top: 0;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
  }

  .layer { position: absolute; inset: 0; }

  /* Corkboard fills the whole viewport so nothing letterboxes ugly. */
  .corkboard {
    background: url("assets/5.png") center center / cover no-repeat;
    z-index: 0;
  }

  /* A board that keeps the original 1366x768 proportions and scales
     to fit any viewport. All aligned artwork lives inside a `.fit`. */
  .fit {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(100vw, calc(100svh * var(--board-w) / var(--board-h)));
    height: min(100svh, calc(100vw * var(--board-h) / var(--board-w)));
  }
  .fit img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }

  /* ---- transition frames (full-bleed: scaled up to cover the screen) ---- */
  /* Purely decorative -- must never intercept clicks, even while fading. */
  .frames { z-index: 1; pointer-events: none; }
  .framewrap { position: absolute; inset: 0; pointer-events: none; }
  .frames img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;      /* fill the entire viewport, cropping as needed */
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    opacity: 0;
  }
  .frames img.on { opacity: 1; }

  /* ---- home page ---- (sits above frames, fades out as you scroll) */
  .home { z-index: 3; }
  .home .paper {
    position: absolute; inset: 0;
    background: url("assets/4.png") center center / cover no-repeat;
  }
  .scroll-hint {
    position: absolute;
    left: 50%;
    bottom: clamp(14px, 3vh, 34px);
    transform: translateX(-50%);
    font-size: clamp(11px, 1.4vw, 15px);
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #2b2b2b;
    opacity: .55;
    animation: bob 1.8s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes bob {
    0%,100% { transform: translate(-50%, 0); }
    50%     { transform: translate(-50%, 6px); }
  }

  /* ---- nav page ---- (fades in at the end, becomes interactive) */
  .nav {
    z-index: 4;
    opacity: 0;
    pointer-events: none;
  }

  /* Nav elements: each is a whole, pre-cropped PNG placed freely, so the
     layout can be rearranged per screen shape. `width` is a % of the board;
     height follows the image. left/top mark the element's CENTER. */
  .navboard {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    /* LANDSCAPE (wider-than-tall) board */
    width:  min(100vw, calc(100svh * 16 / 9));
    height: min(100svh, calc(100vw * 9 / 16));
  }

  .navel {
    position: absolute;
    transform: translate(-50%, -50%);
    display: block;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .navel img {
    display: block;
    width: 100%;
    height: auto;
    pointer-events: none;
    -webkit-user-drag: none;
    user-select: none;
    transition: transform .12s ease, filter .1s ease;
  }
  .navel:hover { z-index: 10; }
  .navel:focus-visible { outline: none; }
  /* crisp (0-blur) white outline hugs the artwork -> instant, no lag */
  .navel:hover img, .navel:focus-visible img {
    transform: scale(1.05);
    filter:
      drop-shadow( 2.5px  0     0 #fff) drop-shadow(-2.5px  0     0 #fff)
      drop-shadow( 0      2.5px 0 #fff) drop-shadow( 0     -2.5px 0 #fff)
      drop-shadow( 1.8px  1.8px 0 #fff) drop-shadow(-1.8px  1.8px 0 #fff)
      drop-shadow( 1.8px -1.8px 0 #fff) drop-shadow(-1.8px -1.8px 0 #fff)
      drop-shadow( 0 6px 9px rgba(0,0,0,.28));
  }

  /* ---------- LANDSCAPE positions (default: wider-than-tall) ----------
     Widths are each element's real cropped pixel-width * one shared scale
     factor (~0.068), so every element renders at the SAME relative scale
     as the others (true to its original size) -- only nudged by up to
     ~10% here and there to balance the (intentionally overlapping) layout. */
  #n-projects    { left: 16.5%; top: 33%;   width: 27.7%; }
  #n-about       { left: 45%;   top: 35%;   width: 30%; }
  #n-offclock    { left: 37%;   top: 80%;   width: 49.2%; }
  #n-experiences { left: 73%;   top: 63%;   width: 29.1%; }
  #n-resume      { left: 8.5%;  top: 82%;   width: 14.3%; }
  #n-linkedin    { left: 61%;   top: 8%;    width: 10.1%; }
  #n-github      { left: 65%;   top: 22%;    width: 10.1%; }
  #n-email       { left: 71%;   top: 7%;    width: 9.9%;  }
  #n-home        { left: 74%;   top: 22%;    width: 10.1%; }

  /* ---------- SQUARE / PORTRAIT: taller board + vertical spread ----------
     Same shared-scale idea, rescaled ~1.25x (fewer columns, more room). */
  @media (max-aspect-ratio: 1/1) {
    .navboard {
      width:  min(100vw, calc(100svh * 3 / 4));
      height: min(100svh, calc(100vw * 4 / 3));
    }
    #n-linkedin    { left: 20%; top: 6%;    width: 15%;   }
    #n-github      { left: 40%; top: 6%;    width: 15%;   }
    #n-email       { left: 60%; top: 6%;    width: 14.7%; }
    #n-home        { left: 80%; top: 6%;    width: 15%;   }
    #n-projects    { left: 25%; top: 32%;   width: 48%;   }
    #n-about       { left: 74%; top: 29%;   width: 46%;   }
    #n-offclock    { left: 70%; top: 50%;   width: 64%;   }
    #n-experiences { left: 47%; top: 76%;   width: 43%;   }
    #n-resume      { left: 14%; top: 80%;   width: 28%;   }
  }

  @media (prefers-reduced-motion: reduce) {
    .scroll-hint { animation: none; }
  }

  /* ---- contact popup (email post-it) ----
     Tapping outside the note (the dim backdrop) closes it and drops you
     right back on the nav page underneath -- nothing ever navigates away. */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .modal.open { opacity: 1; pointer-events: auto; }
  .modal-backdrop {
    position: absolute;
    inset: 0;
    background: transparent;   /* invisible click-catcher -- nav page shows through as-is */
    cursor: pointer;
  }
  .contact-note {
    position: relative;
    width: min(90vw, 420px);
    transform: rotate(2.8deg);
  }
  .modal.open .contact-note { animation: pop .35s ease; }
  .contact-note img {
    width: 100%;
    display: block;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(12px) scale(.96) rotate(-2.8deg); }
    to   { opacity: 1; transform: translateY(0)    scale(1)   rotate(-2.8deg); }
  }
  .contact-note .note {
    position: absolute;
    inset: 0;
    padding: 15% 11%;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }
  .contact-note .line {
    color: #575757;
    text-shadow: .25px .25px 0 rgba(0, 0, 0, .15);
    letter-spacing: .02em;
    line-height: 1.05;
  }
  .contact-note .title {
    font-family: "CoalhandLuke", cursive;
    font-size: clamp(1.8rem, 6.5vw, 3.2rem);
    margin-bottom: clamp(14px, 4vw, 32px);
    transform: rotate(-1deg);
  }
  .contact-note .row {
    font-family: "Over the Rainbow", cursive;
    font-size: clamp(1.1rem, 3.8vw, 2.2rem);
    margin-bottom: clamp(10px, 3vw, 24px);
    transform: rotate(.8deg);
  }
  .contact-note .note a {
    color: inherit;
    text-decoration: none;
    width: max-content;
    transition: .15s ease;
  }
  .contact-note .note a:hover  { opacity: .65; transform: translateX(2px); }
  .contact-note .note a:active { transform: translateX(3px); }
</style>
</head>
<body>
  <div class="scroll-wrap" id="scrollWrap">
    <div class="stage">

      <!-- backdrop -->
      <div class="layer corkboard"></div>

      <!-- stop-motion transition frames (6..27) injected by JS -->
      <div class="layer frames"><div class="framewrap" id="frames"></div></div>

      <!-- HOME -->
      <div class="layer home" id="home">
        <div class="paper"></div>
        <div class="fit">
          <img src="assets/3.png" alt="Polaroid of Vani" />
          <img src="assets/2.png" alt="Vani's Archive: here's how i spend my time" />
        </div>
      </div>

      <!-- NAV -->
      <div class="layer nav" id="nav">
        <div class="navboard">
          <!-- Each element is a whole (pre-cropped) PNG; placed via CSS (#n-*).
               TODO: replace placeholder hrefs with your real section pages / links -->
          <a class="navel" id="n-offclock" href="off-the-clock.html" aria-label="Off the clock"><img src="assets/31.png" alt="Off the clock" /></a>
          <a class="navel" id="n-projects" href="projects.html" aria-label="Projects"><img src="assets/33.png" alt="Projects" /></a>
          <a class="navel" id="n-about" href="about.html" aria-label="About me"><img src="assets/29.png" alt="About me" /></a>
          <a class="navel" id="n-experiences" href="experiences.html" aria-label="Experiences"><img src="assets/30.png" alt="Experiences" /></a>
          <a class="navel" id="n-resume" href="https://drive.google.com/file/d/1dZZIDktKosJerowUmCIa-zAu-b4q9KWc/view?usp=sharing" aria-label="Resume"><img src="assets/32.png" alt="Resume" /></a>
          <a class="navel" id="n-linkedin" href="https://www.linkedin.com/in/vani-sahjwani/" aria-label="LinkedIn"><img src="assets/37.png" alt="LinkedIn" /></a>
          <a class="navel" id="n-github" href="https://github.com/vsahjwani" aria-label="GitHub"><img src="assets/34.png" alt="GitHub" /></a>
          <a class="navel" id="n-email" data-modal="contact" href="contact.html" aria-label="Email"><img src="assets/36.png" alt="Email" /></a>
          <a class="navel" id="n-home" data-home="1" href="#" aria-label="Back to home"><img src="assets/35.png" alt="Home" /></a>
        </div>
      </div>

    </div>
  </div>

  <!-- CONTACT POPUP -->
  <div class="modal" id="contactModal">
    <div class="modal-backdrop" id="contactBackdrop"></div>
    <div class="contact-note">
      <img src="assets/39.png" alt="Sticky note" />
      <div class="note">
        <div class="line title">say hi!</div>
        <a class="line row" href="mailto:vanisahjwani@gmail.com">vanisahjwani@gmail.com</a>
        <a class="line row" href="tel:6199539182">(619) 953-9182</a>
        <a class="line row" href="https://www.linkedin.com/in/vani-sahjwani/">linkedin.com</a>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  // Don't let the browser restore a mid-scroll position on reload.
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";

  var FIRST = 6, LAST = 27;                 // transition frame filenames
  var COUNT = LAST - FIRST + 1;             // 22 frames
  var framesBox = document.getElementById("frames");
  var frameEls = [];
  var current = -1;

  // Build the 22 frame elements up front, but DON'T assign `src` to all of
  // them yet -- these are ~15MB combined, and doing so immediately on load
  // forces the browser to fetch+decode all of it before the page even
  // finishes opening. Instead each frame's `src` is set lazily, the moment
  // it's actually about to be shown (see loadFrame/showFrame below), so
  // opening the page only ever costs the one frame currently on screen.
  for (var i = 0; i < COUNT; i++) {
    var img = document.createElement("img");
    img.className = "frame";
    img.alt = "";
    img.decoding = "async";
    framesBox.appendChild(img);
    frameEls.push(img);
  }

  function loadFrame(idx) {
    var img = frameEls[idx];
    if (!img.src) img.src = "transition/" + (FIRST + idx) + ".png";
  }

  function showFrame(idx) {
    if (idx === current) return;
    if (current >= 0) frameEls[current].classList.remove("on");
    loadFrame(idx);
    // Keep the scroll smooth by having the next frame in either direction
    // ready before it's actually needed.
    if (idx + 1 < COUNT) loadFrame(idx + 1);
    if (idx - 1 >= 0) loadFrame(idx - 1);
    frameEls[idx].classList.add("on");
    current = idx;
  }
  showFrame(0);

  // Warm the cache for the rest of the frames in the background, during
  // idle time, so the first scroll through the transition doesn't have to
  // fetch+decode each PNG right as it's about to appear.
  (function preloadRemainingFrames() {
    var i = 1;
    function step() {
      if (i >= COUNT) return;
      loadFrame(i++);
      if (window.requestIdleCallback) requestIdleCallback(step, { timeout: 200 });
      else setTimeout(step, 60);
    }
    if (window.requestIdleCallback) requestIdleCallback(step, { timeout: 500 });
    else setTimeout(step, 300);
  })();

  var home = document.getElementById("home");
  var nav  = document.getElementById("nav");
  var wrap = document.getElementById("scrollWrap");
  var framesLayer = document.querySelector(".frames");

  // --- sounds ---
  function snd(src, vol) { var a = new Audio(src); a.preload = "auto"; a.volume = vol; return a; }
  var sndTear  = snd("tear.mp3",  0.9);
  var sndHover = snd("hover.mp3", 0.55);
  var sndClick = snd("click.mp3", 0.8);
  function play(a) {
    try { a.currentTime = 0; var pr = a.play(); if (pr && pr.catch) pr.catch(function () {}); }
    catch (e) {}
  }
  // Browsers block audio until the user interacts; prime the clips (silently)
  // on the first gesture so the scroll-triggered tear can play afterwards.
  var audioPrimed = false;
  function primeAudio() {
    if (audioPrimed) return;
    audioPrimed = true;
    [[sndTear, 0.9], [sndHover, 0.55], [sndClick, 0.8]].forEach(function (pair) {
      var a = pair[0]; a.volume = 0;
      try {
        var pr = a.play();
        if (pr && pr.then) pr.then(function () { a.pause(); a.currentTime = 0; a.volume = pair[1]; })
                             .catch(function () { a.volume = pair[1]; });
        else a.volume = pair[1];
      } catch (e) { a.volume = pair[1]; }
    });
  }
  ["pointerdown", "touchstart", "keydown", "wheel"].forEach(function (ev) {
    window.addEventListener(ev, primeAudio, { once: true, passive: true });
  });

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  // smooth 0..1 ramp between edges e0..e1
  function ramp(x, e0, e1) {
    var t = clamp((x - e0) / (e1 - e0), 0, 1);
    return t * t * (3 - 2 * t);
  }

  // --- timeline (fraction of total scroll) ---
  //  0.00–0.06  home holds
  //  0.06–0.14  home fades / tear begins
  //  0.14–0.80  stop-motion frames 6 -> 27
  //  0.86–0.97  nav page fades in & becomes clickable
  var tearArmed = true;
  function render() {
    var travel = wrap.offsetHeight - window.innerHeight;
    var p = travel > 0 ? clamp(window.scrollY / travel, 0, 1) : 0;

    // Tear sound: once as the transition kicks in; re-arm when back at the top.
    if (p < 0.03) tearArmed = true;
    if (tearArmed && p > 0.12) { play(sndTear); tearArmed = false; }

    var homeOp = 1 - ramp(p, 0.06, 0.14);
    home.style.opacity = homeOp;
    home.style.pointerEvents = homeOp > 0.5 ? "auto" : "none";

    var fp = ramp(p, 0.14, 0.80);           // 0..1 across the frame range
    showFrame(Math.round(fp * (COUNT - 1)));

    var navOp = ramp(p, 0.86, 0.97);
    nav.style.opacity = navOp;
    // Gate clickability on p itself (as soon as the tear finishes), not on the
    // fade-in easing curve -- that curve only clears 0.6 in the last ~7% of a
    // very long scroll track, so ordinary scrolling (momentum, not-quite-max
    // scroll) could leave a visually-complete nav page silently unclickable.
    nav.style.pointerEvents = p > 0.80 ? "auto" : "none";

    // Fade the full-bleed frames out as the nav board fades in, so the
    // final (fit-to-screen) layout isn't overlapped by the cover-scaled frame.
    framesLayer.style.opacity = 1 - navOp;
  }

  var ticking = false;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () { render(); ticking = false; });
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", render);

  // Start at the very top on load -- unless we arrived from a section page's
  // "nav" post-it (index.html#nav), in which case jump straight to the nav
  // page (skip the transition) without playing the tear sound.
  if (location.hash === "#nav") {
    tearArmed = false;
    window.scrollTo(0, wrap.offsetHeight - window.innerHeight);
  } else {
    window.scrollTo(0, 0);
  }
  render();

  // Nav element sounds: hover.mp3 on entering a new element, click.mp3 on press.
  var navels = document.querySelectorAll(".navel");
  navels.forEach(function (a) {
    a.addEventListener("mouseenter", function () { play(sndHover); });
    a.addEventListener("pointerdown", function () { play(sndClick); });
  });

  // The "home" post-it returns to the top, which rewinds the transition.
  var homeBtn = document.querySelector("[data-home]");
  if (homeBtn) {
    homeBtn.addEventListener("click", function (e) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  }

  // --- contact popup: opens over the nav page instead of navigating away;
  // tapping the dim backdrop (anywhere outside the note) closes it and
  // drops you right back on the same nav page underneath. ---
  var contactModal    = document.getElementById("contactModal");
  var contactBackdrop = document.getElementById("contactBackdrop");
  var emailBtn        = document.querySelector('[data-modal="contact"]');
  var lastFocused      = null;

  // NOTE: don't freeze scroll via `overflow:hidden` on <html>/<body> here --
  // the whole page relies on a `position: sticky` scroll trick to pin the
  // corkboard scene in place, and toggling overflow:hidden on the scrolling
  // root breaks that stickiness (the scene snaps away, leaving a blank
  // background behind the modal). Block scroll INPUT instead, which stops
  // the position from changing without touching the sticky context at all.
  function blockScrollKeys(e) {
    var keys = ["ArrowUp", "ArrowDown", "PageUp", "PageDown", "Home", "End", " "];
    if (keys.indexOf(e.key) !== -1) e.preventDefault();
  }
  function preventScroll(e) { e.preventDefault(); }

  function openModal() {
    lastFocused = document.activeElement;
    contactModal.classList.add("open");
    window.addEventListener("wheel", preventScroll, { passive: false });
    window.addEventListener("touchmove", preventScroll, { passive: false });
    window.addEventListener("keydown", blockScrollKeys, { passive: false });
  }
  function closeModal() {
    contactModal.classList.remove("open");
    window.removeEventListener("wheel", preventScroll, { passive: false });
    window.removeEventListener("touchmove", preventScroll, { passive: false });
    window.removeEventListener("keydown", blockScrollKeys, { passive: false });
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }

  if (emailBtn) {
    emailBtn.addEventListener("click", function (e) {
      e.preventDefault();
      openModal();
    });
  }
  contactBackdrop.addEventListener("click", closeModal);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && contactModal.classList.contains("open")) closeModal();
  });
})();
</script>
<script src="parrot-widget.js"></script>
</body>
</html>
